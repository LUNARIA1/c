<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vertex Gemini Live Voice</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f4;
      --surface: #ffffff;
      --surface-2: #eef3ef;
      --ink: #17201b;
      --muted: #637067;
      --line: #d8ded9;
      --accent: #13795b;
      --accent-strong: #0d5f47;
      --accent-soft: #dff3ea;
      --danger: #bd3730;
      --danger-soft: #fde8e5;
      --warn: #966600;
      --warn-soft: #fff3cf;
      --focus: #009ad6;
      --shadow: 0 18px 50px rgba(19, 28, 23, 0.12);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    body {
      display: flex;
      justify-content: center;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease,
        color 0.15s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.52;
      transform: none;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfb;
      color: var(--ink);
      outline: none;
    }

    input,
    select {
      min-height: 42px;
      padding: 0 12px;
    }

    textarea {
      min-height: 118px;
      resize: vertical;
      padding: 12px;
      line-height: 1.45;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(0, 154, 214, 0.16);
    }

    .app {
      width: min(1420px, 100%);
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px clamp(18px, 3vw, 34px);
      border-bottom: 1px solid var(--line);
      background: rgba(246, 247, 244, 0.92);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #17201b;
      color: #ffffff;
      flex: 0 0 auto;
    }

    .brand h1 {
      margin: 0;
      font-size: 19px;
      letter-spacing: 0;
      line-height: 1.1;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status-pill {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #9aa59d;
    }

    .status-pill[data-state="connected"] .status-dot {
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(19, 121, 91, 0.12);
    }

    .status-pill[data-state="error"] .status-dot {
      background: var(--danger);
      box-shadow: 0 0 0 5px rgba(189, 55, 48, 0.12);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(300px, 360px) minmax(0, 1fr);
      gap: 18px;
      padding: clamp(18px, 3vw, 34px);
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .settings {
      position: sticky;
      top: 92px;
      max-height: calc(100vh - 116px);
      overflow: auto;
    }

    .panel-header {
      min-height: 62px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }

    .panel-header h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0;
    }

    .panel-header span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .panel-body {
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .actions-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      font-weight: 850;
      color: var(--ink);
      background: var(--surface-2);
      border: 1px solid var(--line);
    }

    .btn:hover:not(:disabled) {
      box-shadow: 0 9px 22px rgba(19, 28, 23, 0.12);
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-strong);
    }

    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: #f4c5c0;
    }

    .btn-quiet {
      background: transparent;
    }

    .icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .notice {
      display: grid;
      gap: 6px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #f4d991;
      background: var(--warn-soft);
      color: #55400b;
      font-size: 13px;
      line-height: 1.45;
    }

    .notice strong {
      color: #3e2d00;
    }

    .main {
      display: grid;
      gap: 18px;
    }

    .conversation {
      min-height: calc(100vh - 142px);
      display: grid;
      grid-template-rows: auto auto minmax(260px, 1fr) auto;
    }

    .hero-control {
      padding: 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }

    .prompt-area {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .prompt-area textarea {
      min-height: 100px;
    }

    .primary-stack {
      display: grid;
      gap: 10px;
      min-width: 178px;
    }

    .big-button {
      min-height: 54px;
      padding: 0 18px;
      font-size: 15px;
    }

    .meters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-bottom: 1px solid var(--line);
      background: #fbfcfb;
    }

    .meter {
      min-height: 74px;
      display: grid;
      gap: 5px;
      align-content: center;
      padding: 13px 16px;
      border-right: 1px solid var(--line);
    }

    .meter:last-child {
      border-right: 0;
    }

    .meter span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .meter strong {
      font-size: 18px;
      line-height: 1.1;
      word-break: break-word;
    }

    .log {
      min-height: 260px;
      padding: 18px;
      overflow: auto;
      display: grid;
      align-content: start;
      gap: 12px;
      background:
        linear-gradient(#ffffff, rgba(255, 255, 255, 0.92)),
        repeating-linear-gradient(
          0deg,
          rgba(23, 32, 27, 0.035) 0,
          rgba(23, 32, 27, 0.035) 1px,
          transparent 1px,
          transparent 42px
        );
    }

    .empty-log {
      height: 100%;
      min-height: 210px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      line-height: 1.45;
      padding: 28px;
    }

    .event {
      max-width: min(760px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 11px 12px;
      display: grid;
      gap: 5px;
    }

    .event.user {
      justify-self: end;
      background: var(--accent-soft);
      border-color: #b8dfcf;
    }

    .event.error {
      background: var(--danger-soft);
      border-color: #f4c5c0;
    }

    .event.system {
      background: #f1f4f8;
    }

    .event small {
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
    }

    .event div {
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .composer {
      min-height: 76px;
      padding: 14px 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      border-top: 1px solid var(--line);
      background: #fbfcfb;
    }

    .composer input {
      min-height: 48px;
    }

    .hidden {
      display: none !important;
    }

    .small-text {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfb;
    }

    .toggle-row span {
      color: var(--ink);
      font-size: 13px;
      font-weight: 750;
    }

    .toggle-row input {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      accent-color: var(--accent);
    }

    .level-shell {
      height: 8px;
      border-radius: 999px;
      background: #dfe6e1;
      overflow: hidden;
    }

    .level-bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.08s linear;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .settings {
        position: static;
        max-height: none;
      }

      .conversation {
        min-height: 680px;
      }
    }

    @media (max-width: 720px) {
      .topbar,
      .hero-control,
      .composer {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: stretch;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .layout {
        padding: 12px;
      }

      .hero-control {
        display: grid;
      }

      .primary-stack {
        grid-template-columns: 1fr 1fr;
      }

      .meters {
        grid-template-columns: 1fr 1fr;
      }

      .meter:nth-child(2) {
        border-right: 0;
      }

      .meter:nth-child(-n + 2) {
        border-bottom: 1px solid var(--line);
      }

      .field-row {
        grid-template-columns: 1fr;
      }

      .composer {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 12a8 8 0 0 1 16 0"></path>
            <path d="M7 12v4a2 2 0 0 0 2 2h1"></path>
            <path d="M17 12v4a2 2 0 0 1-2 2h-1"></path>
            <path d="M12 6v12"></path>
          </svg>
        </div>
        <div>
          <h1>Vertex Gemini Live Voice</h1>
          <p>서비스 계정으로 연결하는 단일 파일 음성 대화 콘솔</p>
        </div>
      </div>
      <div class="top-actions">
        <div id="statusPill" class="status-pill" data-state="idle">
          <span class="status-dot"></span>
          <span id="statusText">준비</span>
        </div>
        <button id="clearLogButton" class="btn btn-quiet" type="button" title="로그 지우기">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18"></path>
            <path d="M8 6V4h8v2"></path>
            <path d="M19 6l-1 14H6L5 6"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
          </svg>
          로그 지우기
        </button>
      </div>
    </header>

    <main class="layout">
      <aside class="panel settings" aria-label="Settings">
        <div class="panel-header">
          <h2>Settings</h2>
          <span>Local</span>
        </div>
        <div class="panel-body">

          <label>
            Project ID
            <input id="projectIdInput" autocomplete="off" placeholder="my-gcp-project">
          </label>

          <label>
            Client Email
            <input id="clientEmailInput" autocomplete="off" placeholder="service-account@project.iam.gserviceaccount.com">
          </label>

          <label>
            Private Key
            <textarea id="privateKeyInput" spellcheck="false" placeholder="-----BEGIN PRIVATE KEY-----
...
-----END PRIVATE KEY-----"></textarea>
          </label>

          <div class="field-row">
            <label>
              Location
              <input id="locationInput" autocomplete="off" value="us-central1">
            </label>

            <label>
              Model
              <input id="modelInput" autocomplete="off" value="gemini-live-2.5-flash-native-audio">
            </label>
          </div>

          <div class="field-row">
            <label>
              Voice
              <select id="voiceSelect">
                <option value="Puck">Puck - Upbeat</option>
                <option value="Zephyr">Zephyr - Bright</option>
                <option value="Kore">Kore - Firm</option>
                <option value="Orus">Orus - Firm</option>
                <option value="Autonoe">Autonoe - Bright</option>
                <option value="Umbriel">Umbriel - Easy-going</option>
                <option value="Erinome">Erinome - Clear</option>
                <option value="Laomedeia">Laomedeia - Upbeat</option>
                <option value="Schedar">Schedar - Even</option>
                <option value="Achird">Achird - Friendly</option>
                <option value="Sadachbia">Sadachbia - Lively</option>
                <option value="Fenrir">Fenrir - Excitable</option>
                <option value="Aoede">Aoede - Breezy</option>
                <option value="Enceladus">Enceladus - Breathy</option>
                <option value="Algieba">Algieba - Smooth</option>
                <option value="Algenib">Algenib - Gravelly</option>
                <option value="Achernar">Achernar - Soft</option>
                <option value="Gacrux">Gacrux - Mature</option>
                <option value="Zubenelgenubi">Zubenelgenubi - Casual</option>
                <option value="Sadaltager">Sadaltager - Knowledgeable</option>
                <option value="Charon">Charon - Informative</option>
                <option value="Leda">Leda - Youthful</option>
                <option value="Callirrhoe">Callirrhoe - Easy-going</option>
                <option value="Iapetus">Iapetus - Clear</option>
                <option value="Despina">Despina - Smooth</option>
                <option value="Rasalgethi">Rasalgethi - Informative</option>
                <option value="Alnilam">Alnilam - Firm</option>
                <option value="Pulcherrima">Pulcherrima - Forward</option>
                <option value="Vindemiatrix">Vindemiatrix - Gentle</option>
                <option value="Sulafat">Sulafat - Warm</option>
              </select>
            </label>

            <label>
              Temperature
              <input id="temperatureInput" type="number" min="0" max="2" step="0.1" value="1">
            </label>
          </div>

          <label class="toggle-row">
            <span>입력 음성 전사</span>
            <input id="inputTranscriptionToggle" type="checkbox" checked>
          </label>

          <label class="toggle-row">
            <span>출력 음성 전사</span>
            <input id="outputTranscriptionToggle" type="checkbox" checked>
          </label>

          <div class="actions-row">
            <button id="saveSettingsButton" class="btn btn-primary" type="button">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path>
                <path d="M17 21v-8H7v8"></path>
                <path d="M7 3v5h8"></path>
              </svg>
              저장
            </button>
            <button id="testAuthButton" class="btn" type="button">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 7a2 2 0 1 1 2 2l-2 2h-3v3H9v3H5v-4l6-6Z"></path>
              </svg>
              인증 테스트
            </button>
            <button id="forgetSettingsButton" class="btn btn-danger" type="button">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18"></path>
                <path d="M8 6V4h8v2"></path>
                <path d="M19 6l-1 14H6L5 6"></path>
              </svg>
              삭제
            </button>
          </div>

          <p class="small-text">
            `대화 시작`을 누르면 OAuth access token을 만들고 Live API WebSocket에 연결합니다. 연결 실패 시 브라우저 WebSocket 인증 제약일 가능성이 높습니다.
          </p>
        </div>
      </aside>

      <section class="main">
        <div class="panel conversation" aria-label="Conversation">
          <div class="hero-control">
            <div class="prompt-area">
              <label>
                System instruction
                <textarea id="systemInstructionInput" spellcheck="true">너는 한국어로 자연스럽고 간결하게 대화하는 음성 AI야. 사용자가 말을 끝내면 바로 응답하고, 너무 길게 말하지 마.</textarea>
              </label>
            </div>

            <div class="primary-stack">
              <button id="startButton" class="btn btn-primary big-button" type="button">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                  <path d="M12 19v3"></path>
                </svg>
                대화 시작
              </button>
              <button id="stopButton" class="btn btn-danger big-button" type="button" disabled>
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                </svg>
                종료
              </button>
              <button id="muteButton" class="btn big-button" type="button" disabled>
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                </svg>
                <span id="muteButtonLabel">마이크 켜짐</span>
              </button>
            </div>
          </div>

          <div class="meters">
            <div class="meter">
              <span>연결</span>
              <strong id="connectionMetric">닫힘</strong>
            </div>
            <div class="meter">
              <span>마이크</span>
              <strong id="micMetric">대기</strong>
              <div class="level-shell" aria-hidden="true">
                <div id="micLevelBar" class="level-bar"></div>
              </div>
            </div>
            <div class="meter">
              <span>전송</span>
              <strong id="sentMetric">0 KB</strong>
            </div>
            <div class="meter">
              <span>수신</span>
              <strong id="receivedMetric">0 KB</strong>
            </div>
          </div>

          <div id="log" class="log" aria-live="polite">
            <div class="empty-log">
              Settings를 저장한 뒤 `대화 시작`을 누르세요.<br>
              마이크 권한을 허용하면 실시간 음성 입력이 시작됩니다.
            </div>
          </div>

          <form id="composerForm" class="composer">
            <input id="textInput" placeholder="텍스트 메시지도 보낼 수 있어요" autocomplete="off" disabled>
            <button id="sendTextButton" class="btn btn-primary" type="submit" disabled>
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m22 2-7 20-4-9-9-4Z"></path>
                <path d="M22 2 11 13"></path>
              </svg>
              보내기
            </button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "vertex-gemini-live-single-file-v1";
    const TOKEN_URL = "https://oauth2.googleapis.com/token";
    const OAUTH_SCOPE = "https://www.googleapis.com/auth/cloud-platform";
    const INPUT_RATE = 16000;
    const OUTPUT_RATE = 24000;

    const elements = {
      statusPill: document.getElementById("statusPill"),
      statusText: document.getElementById("statusText"),
      projectId: document.getElementById("projectIdInput"),
      clientEmail: document.getElementById("clientEmailInput"),
      privateKey: document.getElementById("privateKeyInput"),
      location: document.getElementById("locationInput"),
      model: document.getElementById("modelInput"),
      voice: document.getElementById("voiceSelect"),
      temperature: document.getElementById("temperatureInput"),
      inputTranscription: document.getElementById("inputTranscriptionToggle"),
      outputTranscription: document.getElementById("outputTranscriptionToggle"),
      saveSettings: document.getElementById("saveSettingsButton"),
      testAuth: document.getElementById("testAuthButton"),
      forgetSettings: document.getElementById("forgetSettingsButton"),
      systemInstruction: document.getElementById("systemInstructionInput"),
      start: document.getElementById("startButton"),
      stop: document.getElementById("stopButton"),
      mute: document.getElementById("muteButton"),
      log: document.getElementById("log"),
      clearLog: document.getElementById("clearLogButton"),
      composer: document.getElementById("composerForm"),
      text: document.getElementById("textInput"),
      sendText: document.getElementById("sendTextButton"),
      connectionMetric: document.getElementById("connectionMetric"),
      micMetric: document.getElementById("micMetric"),
      sentMetric: document.getElementById("sentMetric"),
      receivedMetric: document.getElementById("receivedMetric"),
      micLevelBar: document.getElementById("micLevelBar"),
      muteLabel: document.getElementById("muteButtonLabel"),
    };

    const state = {
      ws: null,
      audioContext: null,
      micStream: null,
      micSource: null,
      micProcessor: null,
      silentGain: null,
      playbackContext: null,
      playbackSources: new Set(),
      nextPlaybackTime: 0,
      connected: false,
      micMuted: false,
      bytesSent: 0,
      bytesReceived: 0,
      token: null,
      tokenExpiresAt: 0,
    };

    function loadSettings() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        elements.projectId.value = saved.projectId || "";
        elements.clientEmail.value = saved.clientEmail || "";
        elements.privateKey.value = saved.privateKey || "";
        elements.location.value = saved.location || "us-central1";
        elements.model.value = saved.model || "gemini-live-2.5-flash-native-audio";
        elements.voice.value = saved.voice || "Puck";
        elements.temperature.value = saved.temperature || "1";
        elements.systemInstruction.value = saved.systemInstruction || elements.systemInstruction.value;
        elements.inputTranscription.checked = saved.inputTranscription !== false;
        elements.outputTranscription.checked = saved.outputTranscription !== false;
      } catch (error) {
        addLog("설정 읽기 실패: " + error.message, "error");
      }
    }

    function collectSettings() {
      return {
        projectId: elements.projectId.value.trim(),
        clientEmail: elements.clientEmail.value.trim(),
        privateKey: normalizePrivateKey(elements.privateKey.value.trim()),
        location: elements.location.value.trim() || "us-central1",
        model: elements.model.value.trim() || "gemini-live-2.5-flash-native-audio",
        voice: elements.voice.value,
        temperature: Number(elements.temperature.value || 1),
        inputTranscription: elements.inputTranscription.checked,
        outputTranscription: elements.outputTranscription.checked,
        systemInstruction: elements.systemInstruction.value.trim(),
      };
    }

    function validateSettings(settings) {
      const missing = [];
      if (!settings.projectId) missing.push("Project ID");
      if (!settings.clientEmail) missing.push("Client Email");
      if (!settings.privateKey) missing.push("Private Key");
      if (!settings.privateKey.includes("BEGIN PRIVATE KEY")) {
        missing.push("올바른 Private Key PEM");
      }
      if (missing.length) {
        throw new Error("Settings에서 다음 값을 확인하세요: " + missing.join(", "));
      }
    }

    function saveSettings() {
      const settings = collectSettings();
      validateSettings(settings);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
      addLog("Settings를 localStorage에 저장했습니다.", "system");
    }

    function forgetSettings() {
      localStorage.removeItem(STORAGE_KEY);
      elements.projectId.value = "";
      elements.clientEmail.value = "";
      elements.privateKey.value = "";
      addLog("저장된 Settings를 삭제했습니다.", "system");
    }

    function normalizePrivateKey(value) {
      return value.replace(/\\n/g, "\n").replace(/\r\n/g, "\n").trim();
    }

    function setStatus(label, mode = "idle") {
      elements.statusText.textContent = label;
      elements.statusPill.dataset.state = mode;
    }

    function setConnectedUi(connected) {
      state.connected = connected;
      elements.start.disabled = connected;
      elements.stop.disabled = !connected;
      elements.mute.disabled = !connected;
      elements.text.disabled = !connected;
      elements.sendText.disabled = !connected;
      elements.connectionMetric.textContent = connected ? "열림" : "닫힘";
      setStatus(connected ? "연결됨" : "준비", connected ? "connected" : "idle");
    }

    function addLog(message, type = "system", label) {
      const empty = elements.log.querySelector(".empty-log");
      if (empty) empty.remove();

      const entry = document.createElement("article");
      entry.className = "event " + type;

      const caption = document.createElement("small");
      caption.textContent = label || ({
        user: "user",
        assistant: "assistant",
        error: "error",
        system: "system",
      }[type] || "event");

      const body = document.createElement("div");
      body.textContent = message;

      entry.append(caption, body);
      elements.log.append(entry);
      elements.log.scrollTop = elements.log.scrollHeight;
    }

    function clearLog() {
      elements.log.innerHTML = "";
      const empty = document.createElement("div");
      empty.className = "empty-log";
      empty.innerHTML = "로그를 비웠습니다.<br>새 이벤트가 여기에 표시됩니다.";
      elements.log.append(empty);
    }

    function base64UrlEncode(bytesOrString) {
      const bytes = typeof bytesOrString === "string"
        ? new TextEncoder().encode(bytesOrString)
        : new Uint8Array(bytesOrString);
      let binary = "";
      for (const byte of bytes) binary += String.fromCharCode(byte);
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function pemToArrayBuffer(pem) {
      const clean = pem
        .replace(/-----BEGIN PRIVATE KEY-----/g, "")
        .replace(/-----END PRIVATE KEY-----/g, "")
        .replace(/\s+/g, "");
      const binary = atob(clean);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes.buffer;
    }

    async function signJwt(settings) {
      const now = Math.floor(Date.now() / 1000);
      const header = { alg: "RS256", typ: "JWT" };
      const payload = {
        iss: settings.clientEmail,
        scope: OAUTH_SCOPE,
        aud: TOKEN_URL,
        iat: now,
        exp: now + 3600,
      };

      const encodedHeader = base64UrlEncode(JSON.stringify(header));
      const encodedPayload = base64UrlEncode(JSON.stringify(payload));
      const signingInput = encodedHeader + "." + encodedPayload;

      const key = await crypto.subtle.importKey(
        "pkcs8",
        pemToArrayBuffer(settings.privateKey),
        { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" },
        false,
        ["sign"]
      );

      const signature = await crypto.subtle.sign(
        "RSASSA-PKCS1-v1_5",
        key,
        new TextEncoder().encode(signingInput)
      );

      return signingInput + "." + base64UrlEncode(signature);
    }

    async function getAccessToken(force = false) {
      const settings = collectSettings();
      validateSettings(settings);

      if (!force && state.token && Date.now() < state.tokenExpiresAt - 60000) {
        return state.token;
      }

      setStatus("토큰 발급 중", "idle");
      const assertion = await signJwt(settings);
      const form = new URLSearchParams({
        grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
        assertion,
      });

      const response = await fetch(TOKEN_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: form,
      });

      const json = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(json.error_description || json.error || "OAuth token request failed");
      }

      state.token = json.access_token;
      state.tokenExpiresAt = Date.now() + Number(json.expires_in || 3600) * 1000;
      return state.token;
    }

    function buildServiceUrl(settings, token) {
      const host = `${settings.location}-aiplatform.googleapis.com`;
      const path = "/ws/google.cloud.aiplatform.v1beta1.LlmBidiService/BidiGenerateContent";
      return `wss://${host}${path}?access_token=${encodeURIComponent(token)}`;
    }

    function buildSetupMessage(settings) {
      const modelPath = `projects/${settings.projectId}/locations/${settings.location}/publishers/google/models/${settings.model}`;
      const setup = {
        model: modelPath,
        generation_config: {
          response_modalities: ["AUDIO"],
          temperature: settings.temperature,
          speech_config: {
            voice_config: {
              prebuilt_voice_config: {
                voice_name: settings.voice,
              },
            },
          },
        },
        system_instruction: {
          parts: [{ text: settings.systemInstruction || "" }],
        },
        realtime_input_config: {
          automatic_activity_detection: {
            disabled: false,
            silence_duration_ms: 1200,
            prefix_padding_ms: 300,
          },
          activity_handling: "START_OF_ACTIVITY_INTERRUPTS",
        },
      };

      if (settings.inputTranscription) setup.input_audio_transcription = {};
      if (settings.outputTranscription) setup.output_audio_transcription = {};
      return { setup };
    }

    async function startConversation() {
      const settings = collectSettings();
      validateSettings(settings);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));

      resetCounters();
      setStatus("연결 중", "idle");
      addLog("OAuth 토큰을 만들고 Live API에 연결합니다.", "system");

      const token = await getAccessToken();
      const url = buildServiceUrl(settings, token);

      await new Promise((resolve, reject) => {
        const ws = new WebSocket(url);
        let opened = false;

        ws.onopen = async () => {
          opened = true;
          state.ws = ws;
          setConnectedUi(true);
          addLog("WebSocket 연결이 열렸습니다. 세션 설정을 보냅니다.", "system");
          sendJson(buildSetupMessage(settings));

          try {
            await startMicrophone();
            addLog("마이크 스트리밍을 시작했습니다.", "system");
          } catch (error) {
            addLog("마이크 시작 실패: " + error.message, "error");
          }

          resolve();
        };

        ws.onmessage = handleServerMessage;

        ws.onerror = () => {
          setStatus("연결 오류", "error");
          if (!opened) {
            reject(new Error("WebSocket 연결에 실패했습니다. Vertex AI WebSocket은 브라우저에서 Authorization 헤더를 보낼 수 없어 query token을 거부할 수 있습니다."));
          }
        };

        ws.onclose = (event) => {
          const reason = event.reason ? ` (${event.reason})` : "";
          addLog(`WebSocket이 닫혔습니다. code=${event.code}${reason}`, event.wasClean ? "system" : "error");
          stopConversation(false);
          if (!opened) {
            reject(new Error(`WebSocket이 열리기 전에 닫혔습니다. code=${event.code}${reason}`));
          }
        };
      });
    }

    function stopConversation(closeSocket = true) {
      stopMicrophone();
      stopPlayback();

      if (closeSocket && state.ws) {
        try {
          state.ws.close(1000, "user stopped");
        } catch (error) {
          console.warn(error);
        }
      }

      state.ws = null;
      state.micMuted = false;
      elements.muteLabel.textContent = "마이크 켜짐";
      setConnectedUi(false);
      elements.micMetric.textContent = "대기";
      elements.micLevelBar.style.width = "0%";
    }

    function sendJson(payload) {
      if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
        throw new Error("WebSocket이 열려 있지 않습니다.");
      }
      const encoded = JSON.stringify(payload);
      state.ws.send(encoded);
      state.bytesSent += new TextEncoder().encode(encoded).length;
      updateByteMetrics();
    }

    function sendRealtimeAudio(base64) {
      sendJson({
        realtime_input: {
          media_chunks: [
            {
              mime_type: "audio/pcm;rate=16000",
              data: base64,
            },
          ],
        },
      });
    }

    function sendText(text) {
      sendJson({
        client_content: {
          turns: [
            {
              role: "user",
              parts: [{ text }],
            },
          ],
          turn_complete: true,
        },
      });
      addLog(text, "user");
    }

    async function startMicrophone() {
      if (state.micStream) stopMicrophone();

      state.micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        },
      });

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      state.audioContext = new AudioContextClass();
      state.micSource = state.audioContext.createMediaStreamSource(state.micStream);
      state.micProcessor = state.audioContext.createScriptProcessor(4096, 1, 1);
      state.silentGain = state.audioContext.createGain();
      state.silentGain.gain.value = 0;

      const sourceRate = state.audioContext.sampleRate;
      state.micProcessor.onaudioprocess = (event) => {
        if (!state.connected || state.micMuted) return;
        const input = event.inputBuffer.getChannelData(0);
        updateMicLevel(input);
        const pcm16 = floatToPcm16(downsample(input, sourceRate, INPUT_RATE));
        if (!pcm16.byteLength) return;
        sendRealtimeAudio(arrayBufferToBase64(pcm16));
      };

      state.micSource.connect(state.micProcessor);
      state.micProcessor.connect(state.silentGain);
      state.silentGain.connect(state.audioContext.destination);
      elements.micMetric.textContent = "켜짐";
    }

    function stopMicrophone() {
      if (state.micProcessor) {
        state.micProcessor.disconnect();
        state.micProcessor.onaudioprocess = null;
      }
      if (state.micSource) state.micSource.disconnect();
      if (state.silentGain) state.silentGain.disconnect();
      if (state.micStream) {
        for (const track of state.micStream.getTracks()) track.stop();
      }
      if (state.audioContext) {
        state.audioContext.close().catch(() => {});
      }

      state.micProcessor = null;
      state.micSource = null;
      state.silentGain = null;
      state.micStream = null;
      state.audioContext = null;
    }

    function downsample(buffer, inputRate, outputRate) {
      if (inputRate === outputRate) return buffer;
      const ratio = inputRate / outputRate;
      const newLength = Math.floor(buffer.length / ratio);
      const result = new Float32Array(newLength);
      let offsetResult = 0;
      let offsetBuffer = 0;

      while (offsetResult < result.length) {
        const nextOffsetBuffer = Math.floor((offsetResult + 1) * ratio);
        let sum = 0;
        let count = 0;

        for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i += 1) {
          sum += buffer[i];
          count += 1;
        }

        result[offsetResult] = count ? sum / count : 0;
        offsetResult += 1;
        offsetBuffer = nextOffsetBuffer;
      }

      return result;
    }

    function floatToPcm16(float32) {
      const output = new Int16Array(float32.length);
      for (let i = 0; i < float32.length; i += 1) {
        const sample = Math.max(-1, Math.min(1, float32[i]));
        output[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
      }
      return output.buffer;
    }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = "";
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function base64ToPcmFloat32(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }
      const pcm = new Int16Array(bytes.buffer);
      const floats = new Float32Array(pcm.length);
      for (let i = 0; i < pcm.length; i += 1) {
        floats[i] = pcm[i] / 32768;
      }
      return floats;
    }

    async function playAudio(base64Audio) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!state.playbackContext) {
        state.playbackContext = new AudioContextClass();
        state.nextPlaybackTime = state.playbackContext.currentTime;
      }

      if (state.playbackContext.state === "suspended") {
        await state.playbackContext.resume();
      }

      const floats = base64ToPcmFloat32(base64Audio);
      const buffer = state.playbackContext.createBuffer(1, floats.length, OUTPUT_RATE);
      buffer.copyToChannel(floats, 0);

      const source = state.playbackContext.createBufferSource();
      source.buffer = buffer;
      source.connect(state.playbackContext.destination);
      source.onended = () => state.playbackSources.delete(source);

      const startAt = Math.max(state.playbackContext.currentTime + 0.02, state.nextPlaybackTime);
      source.start(startAt);
      state.nextPlaybackTime = startAt + buffer.duration;
      state.playbackSources.add(source);
    }

    function stopPlayback() {
      for (const source of state.playbackSources) {
        try {
          source.stop();
        } catch (error) {
          console.warn(error);
        }
      }
      state.playbackSources.clear();
      if (state.playbackContext) {
        state.nextPlaybackTime = state.playbackContext.currentTime;
      }
    }

    function handleServerMessage(event) {
      const raw = event.data;
      if (typeof raw === "string") {
        state.bytesReceived += new TextEncoder().encode(raw).length;
      } else if (raw instanceof Blob) {
        state.bytesReceived += raw.size;
      }
      updateByteMetrics();

      if (typeof raw !== "string") {
        addLog("바이너리 메시지를 받았습니다.", "system");
        return;
      }

      let message;
      try {
        message = JSON.parse(raw);
      } catch (error) {
        addLog("JSON 파싱 실패: " + error.message, "error");
        return;
      }

      if (message.setupComplete) {
        addLog("세션 준비가 완료되었습니다.", "system");
        return;
      }

      const serverContent = message.serverContent || message.server_content;
      if (serverContent?.interrupted) {
        stopPlayback();
        addLog("사용자 입력으로 모델 음성을 중단했습니다.", "system");
      }

      const inputTranscript = serverContent?.inputTranscription || message.inputTranscription;
      if (inputTranscript?.text) {
        addLog(inputTranscript.text, "user", inputTranscript.finished ? "user transcript" : "user partial");
      }

      const outputTranscript = serverContent?.outputTranscription || message.outputTranscription;
      if (outputTranscript?.text) {
        addLog(outputTranscript.text, "assistant", outputTranscript.finished ? "assistant transcript" : "assistant partial");
      }

      const parts = serverContent?.modelTurn?.parts || serverContent?.model_turn?.parts || [];
      for (const part of parts) {
        if (part.text) addLog(part.text, "assistant", "assistant text");
        const inlineData = part.inlineData || part.inline_data;
        if (inlineData?.data) {
          playAudio(inlineData.data).catch((error) => {
            addLog("오디오 재생 실패: " + error.message, "error");
          });
        }
      }

      if (serverContent?.turnComplete || serverContent?.turn_complete) {
        addLog("응답 턴이 완료되었습니다.", "system");
      }

      if (message.goAway || message.go_away) {
        addLog("서버가 곧 연결을 종료한다는 알림을 보냈습니다.", "system");
      }

      if (message.error) {
        addLog(JSON.stringify(message.error, null, 2), "error");
      }
    }

    function updateMicLevel(samples) {
      let sum = 0;
      for (let i = 0; i < samples.length; i += 1) {
        sum += samples[i] * samples[i];
      }
      const rms = Math.sqrt(sum / samples.length);
      const percent = Math.min(100, Math.round(rms * 260));
      elements.micLevelBar.style.width = percent + "%";
    }

    function resetCounters() {
      state.bytesSent = 0;
      state.bytesReceived = 0;
      updateByteMetrics();
    }

    function updateByteMetrics() {
      elements.sentMetric.textContent = formatBytes(state.bytesSent);
      elements.receivedMetric.textContent = formatBytes(state.bytesReceived);
    }

    function formatBytes(value) {
      if (value < 1024) return value + " B";
      if (value < 1024 * 1024) return (value / 1024).toFixed(1) + " KB";
      return (value / 1024 / 1024).toFixed(2) + " MB";
    }

    elements.saveSettings.addEventListener("click", () => {
      try {
        saveSettings();
      } catch (error) {
        addLog(error.message, "error");
      }
    });

    elements.forgetSettings.addEventListener("click", forgetSettings);
    elements.clearLog.addEventListener("click", clearLog);

    elements.testAuth.addEventListener("click", async () => {
      try {
        saveSettings();
        await getAccessToken(true);
        addLog("OAuth access token 발급에 성공했습니다.", "system");
        setStatus("인증 성공", "connected");
        window.setTimeout(() => {
          if (!state.connected) setStatus("준비", "idle");
        }, 1600);
      } catch (error) {
        setStatus("인증 실패", "error");
        addLog("인증 테스트 실패: " + error.message, "error");
      }
    });

    elements.start.addEventListener("click", async () => {
      try {
        await startConversation();
      } catch (error) {
        setStatus("시작 실패", "error");
        addLog(error.message, "error");
        stopConversation();
      }
    });

    elements.stop.addEventListener("click", () => {
      addLog("사용자가 대화를 종료했습니다.", "system");
      stopConversation();
    });

    elements.mute.addEventListener("click", () => {
      state.micMuted = !state.micMuted;
      elements.muteLabel.textContent = state.micMuted ? "마이크 꺼짐" : "마이크 켜짐";
      elements.micMetric.textContent = state.micMuted ? "꺼짐" : "켜짐";
      if (state.micMuted) elements.micLevelBar.style.width = "0%";
    });

    elements.composer.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = elements.text.value.trim();
      if (!text) return;
      try {
        sendText(text);
        elements.text.value = "";
      } catch (error) {
        addLog("메시지 전송 실패: " + error.message, "error");
      }
    });

    window.addEventListener("beforeunload", () => {
      stopConversation();
    });

    loadSettings();
    setConnectedUi(false);
  </script>
</body>
</html>
